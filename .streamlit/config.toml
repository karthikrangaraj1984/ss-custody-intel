# Look of the web app: same theme as the State Street ETF Monitor (ssga-etf-agent)
[theme]
base = "light"
primaryColor = "#D97757"
backgroundColor = "#FAF9F5"
secondaryBackgroundColor = "#F0EEE6"
textColor = "#141413"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
port = 8502   # the Fund Analysis Agent (ssga-etf-agent) uses 8501
